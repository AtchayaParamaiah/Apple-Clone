<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Play Cinematic Sequence</title>
    <style>
        /* 1. Reset and Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden; /* Prevents scrolling during the sequence */
            font-family: sans-serif;
        }

        /* 2. The "Video" Container */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* 3. Image Styling */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures images fill the screen like a video */
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smooth fade transition */
        }

        .slide.active {
            opacity: 1;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 768px) {
            .slide {
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- REPLACE THE URLS BELOW -->
        <img src="https://picsum.photos/seed/picsum/200/300" class="slide" id="img1">
        <img src="tps://picsum.photos/200/300?grayscale" class="slide" id="img2">
        <img src="https://picsum.photos/200/300/?blur" class="slide" id="img3">
    </div>

    <script>
        /**
         * CONFIGURATION
         * change the displayTime (ms) to make images stay longer or shorter
         */
        const displayTime = 4000; // 4 seconds per image
        const images = document.querySelectorAll('.slide');
        let currentIndex = 0;

        function playSequence() {
            // Remove active class from all images
            images.forEach(img => img.classList.remove('active'));

            // Add active class to current image
            images[currentIndex].classList.add('active');

            // Move to next image
            currentIndex++;

            // If we reach the end, loop back to the first image
            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            // Schedule the next transition
            setTimeout(playSequence, displayTime);
        }

        // Trigger the sequence immediately upon window load
        window.onload = () => {
            playSequence();
        };
    </script>
</body>
</html>
